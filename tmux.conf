# Sources of inspiration
#   https://gist.github.com/shinzui/866897

# rebind prefix key to something sensible
unbind C-b
set-option -g prefix C-]
# screen sends its literal prefix with `C-a a`, so: prefix then `a`. This used to be bound to `]`,
# but `bind ] paste-buffer` below overrode it, so send-prefix didn't work at all.
bind a send-prefix

# No default-command on purpose. Setting one makes tmux run a NON-login shell, which skips
# ~/.bash_profile (so no aliases or completions in panes). Leaving it unset means tmux runs
# $SHELL as a login shell. The old value wrapped bash in reattach-to-user-namespace to get
# pbcopy/pbpaste working inside tmux; tmux does that natively as of 2.6, so it's not needed.

set-option -g set-titles on

# toggle window
bind C-] last-window

# scrollback buffer n lines
set -g history-limit 100000

# listen for activity on all windows
set -g bell-action any

# tell tmux to use 256 colour terminal
set -g default-terminal "tmux-256color"

# reload tmux.conf
# bind R source-file ~/.tmux.conf
bind R source-file ~/.tmux.conf \; display-message "source-file done";

# copying and pasting
set -g mode-keys vi
bind [ copy-mode
bind Escape copy-mode
bind ] paste-buffer
bind y run "tmux save-buffer - | pbcopy"

# enable mouse selection in copy mode
#   Not sure I like this. It makes it impossible to use the mouse to select things normally in iTerm2
# setw -g mode-mouse off

# screen like keybindings

# new window
bind C-c new-window
bind c new-window

# title (default key in tmux is ',')
bind A command-prompt "rename-window %%"

# displays
bind * list-clients
 
# redisplay (default key in tmux is 'r')
#bind C-l refresh-client
#bind l refresh-client
bind r refresh-client

# amount of time for which status line messages and other indicators
# are displayed. time is in milliseconds.
set -g display-time 2000

set -g status-left-length 25
set -g status-left "[#S]"
set -g status-right "\"#h\" #(uptime | sed 's/.*load averages*: //') %F %T"
set -g status-right-length 60

# Would like the character displayed by #F to be 👀
# set -g window-status-format "#I:#W#F"
